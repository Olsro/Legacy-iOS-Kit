name: Check olsn0w
on:
  push:
    paths:
      - '.gitignore'
      - 'resources/olsn0w/**'
      - 'restore.sh'
      - '.github/workflows/olsn0w.yml'
  pull_request:
    paths:
      - '.gitignore'
      - 'resources/olsn0w/**'
      - 'restore.sh'
      - '.github/workflows/olsn0w.yml'
jobs:
  host-checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r resources/olsn0w/requirements.txt
      - run: python -m unittest discover -s resources/olsn0w/tests -v
      - run: bash -n restore.sh && sh -n resources/olsn0w/setup.sh && sh -n resources/olsn0w/run.sh
      - run: bash restore.sh --olsn0w --help
