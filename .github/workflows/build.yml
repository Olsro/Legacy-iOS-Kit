name: Create zip files
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  create-zip-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read fork version
        run: |
          version=$(tr -d '\r\n' < VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid VERSION"; exit 1; }
          version_current="v$version"
          echo "VERSION_CURRENT=$version_current" >> $GITHUB_ENV

      - name: Create complete release ZIP
        run: |
          archive="${{ github.event.repository.name }}_${{ env.VERSION_CURRENT }}.zip"
          git archive --format=zip --output="$archive" HEAD
          git rev-parse HEAD > resources/git_hash
          zip "$archive" resources/git_hash

      - name: Ensure latest release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest -R ${{ github.repository }} >/dev/null 2>&1 || \
            gh release create latest -R ${{ github.repository }} \
              --title "Latest-${{ env.VERSION_CURRENT }}" \
              --target ${{ github.sha }} --notes "Latest build of Olsro's Legacy iOS Kit."

      - name: Remove all assets from latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets=$(gh release view latest --json assets -q '.assets[].name' || true)

          if [[ -z "$assets" ]]; then
            echo "No assets found on release 'latest'"
            exit 0
          fi

          for asset in $assets; do
            echo "Deleting asset: $asset"
            gh release delete-asset latest "$asset" -R ${{ github.repository }} -y
          done

      - name: Update latest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload latest \
            ${{ github.event.repository.name }}_${{ env.VERSION_CURRENT }}.zip \
            --clobber -R ${{ github.repository }}

          gh release edit latest \
            --title "Latest-${{ env.VERSION_CURRENT }}" \
            --target ${{ github.sha }} -R ${{ github.repository }}
